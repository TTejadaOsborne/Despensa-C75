<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despensa</title>
<meta name="theme-color" content="#2F5233">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despensa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div>
      <h1>Despensa</h1>
      <div class="subtitle" id="syncStatus">Sincronizando…</div>
    </div>
  </header>

  <div id="bannerZone"></div>

  <main>

    <!-- INVENTARIO -->
    <section class="view active" id="view-inventario">
      <div class="metrics" id="invMetrics"></div>
      <div id="invSelectBar"></div>
      <div id="invList"></div>
    </section>

    <!-- MENÚ -->
    <section class="view" id="view-menu">
      <div class="day-tabs" id="dayTabs"></div>
      <div id="menuBody"></div>
    </section>

    <!-- COMPRA -->
    <section class="view" id="view-compra">
      <div class="section-head">
        <h2>Lista de la compra</h2>
        <button class="mini-link" id="btnWhatsapp">Enviar por WhatsApp</button>
      </div>
      <button class="btn btn-secondary btn-block" id="btnScanTicket" style="margin-bottom:14px;">📷 Escanear ticket</button>
      <div class="shop-progress"><div class="shop-progress-bar" id="shopProgressBar" style="width:0%"></div></div>
      <div id="shopList"></div>
      <button class="btn btn-primary btn-block" id="btnConfirmPurchase" style="margin-top:14px;">Confirmar compra</button>
    </section>

    <!-- HISTORIAL -->
    <section class="view" id="view-historial">
      <div class="section-head"><h2>Historial de compras</h2></div>
      <div id="histList"></div>
    </section>

  </main>

  <button class="fab" id="fabAdd" title="Añadir producto">+</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="inventario">
      <span class="tab-icon">🧺</span><span class="tab-label">Inventario</span>
    </button>
    <button class="tab-btn" data-view="menu">
      <span class="tab-icon">📋</span><span class="tab-label">Menú</span>
    </button>
    <button class="tab-btn" data-view="compra">
      <span class="tab-icon">🛒</span><span class="tab-label">Compra</span>
      <span class="badge" id="shopBadge" style="display:none;">0</span>
    </button>
    <button class="tab-btn" data-view="historial">
      <span class="tab-icon">🕓</span><span class="tab-label">Historial</span>
    </button>
  </nav>

</div>

<div id="modalRoot"></div>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
